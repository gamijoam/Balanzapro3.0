name: backend

# No path filters: "backend" is a required status check on main, so it must
# report on every PR (a docs-only PR would otherwise never get it and stay
# blocked).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # The job name is the required status check on main
    # (docs/deployment/github-governance.md). Renaming it requires updating
    # the branch protection.
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Disposable CI database with synthetic data only.
        image: postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp-ci-only
          POSTGRES_DB: bp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bp -d bp_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BP_TEST_DATABASE_URL: postgres://bp:bp-ci-only@127.0.0.1:5432/bp_test?sslmode=disable
      BP_REQUIRE_DB: "1"
      GOTOOLCHAIN: go1.26.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 (Node 24)
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: toolchain
        # go.mod pins go/toolchain 1.26.11 (stdlib fixes, ADR-170); fail if
        # the runner ended up on anything else.
        run: go version | grep -q 'go1.26.11 ' || (go version && exit 1)
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: tests (unit + PostgreSQL integration, race detector)
        run: make test-integration
      - name: build
        run: make build
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
