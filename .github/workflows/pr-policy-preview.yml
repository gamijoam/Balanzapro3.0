name: PR Policy preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pr-policy-preview:
    # Head-controlled bootstrap tests, never a required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/governance -p 'test_pr_policy.py'
