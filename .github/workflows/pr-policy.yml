name: PR Policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned, ready_for_review, converted_to_draft]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: pr-policy-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate metadata from trusted base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/governance/pr_policy.py
