name: secrets-scan
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    # The target event uses the base workflow, never checks out or runs PR code.
    # The pull_request run is a head-controlled bootstrap preview, not a gate.
    name: ${{ github.event_name == 'pull_request' && 'secrets-preview' || 'secrets-scan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-trusted.toml"
          touch "$RUNNER_TEMP/gitleaks-empty.ignore"
      - name: Scan commits and sensitive paths without publishing findings
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          # No PR configuration, inline allow comments or ignore file are trusted.
          if ! "$RUNNER_TEMP/gitleaks" git --log-opts="$range" \
            --config "$RUNNER_TEMP/gitleaks-trusted.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --log-level error \
            --max-archive-depth 2 . > "$RUNNER_TEMP/gitleaks-private.log" 2>&1; then
            echo "::error::Secret scan failed or detected credentials. Investigate securely; no findings are printed."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, subprocess
          head = os.environ["HEAD_SHA"]
          base = os.environ["BASE_SHA"]
          paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "-z", head]).split(b"\0")
          rev = base + ".." + head if base else head
          paths += subprocess.check_output(["git", "log", "--format=", "--name-only", "-z", rev]).split(b"\0")
          pattern = re.compile(r"(^|/)(\.env(\..+)?|id_(rsa|ed25519|ecdsa)|credentials\.json|\.netrc|\.npmrc|\.pypirc)$|\.(pem|key|p12|pfx|jks|sql\.gz|dump)$", re.I)
          safe_env = {".env.example", ".env.sample", ".env.template"}
          for raw in paths:
              path = raw.decode(errors="replace").strip("\n")
              if pattern.search(path) and path.rsplit("/", 1)[-1] not in safe_env:
                  raise SystemExit("Sensitive filename detected. Review privately; path withheld.")
          print("Sensitive file names: OK")
          PY
          echo "Secret scan completed without findings."
